<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AQL — OG card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0B0A08;
      --bg-elev: #15130F;
      --border: #2A2620;
      --border-bright: #3A3527;
      --cream: #EDE6D3;
      --cream-dim: #B8B0A0;
      --muted: #6B6557;
      --lime: #CCFF33;
      --amber: #E97451;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    html, body {
      width: 1200px; height: 630px;
      background: var(--bg); color: var(--cream);
      font-family: 'Manrope', sans-serif;
      overflow: hidden;
    }
    .card {
      position: relative;
      width: 1200px; height: 630px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      background:
        radial-gradient(ellipse 70% 60% at 80% 50%, rgba(204, 255, 51, 0.10) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 15% 85%, rgba(233, 116, 81, 0.07) 0%, transparent 60%),
        var(--bg);
    }
    /* faint grid */
    .grid-bg {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(237, 230, 211, 0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(237, 230, 211, 0.022) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, black, transparent 90%);
      pointer-events: none;
    }
    /* corner registration marks */
    .corner {
      position: absolute; width: 24px; height: 24px;
      pointer-events: none;
    }
    .corner::before, .corner::after {
      content: ''; position: absolute; background: var(--cream-dim); opacity: 0.5;
    }
    .corner.tl { top: 28px; left: 28px; }
    .corner.tl::before { top: 0; left: 0; width: 24px; height: 1px; }
    .corner.tl::after  { top: 0; left: 0; width: 1px; height: 24px; }
    .corner.tr { top: 28px; right: 28px; }
    .corner.tr::before { top: 0; right: 0; width: 24px; height: 1px; }
    .corner.tr::after  { top: 0; right: 0; width: 1px; height: 24px; }
    .corner.bl { bottom: 28px; left: 28px; }
    .corner.bl::before { bottom: 0; left: 0; width: 24px; height: 1px; }
    .corner.bl::after  { bottom: 0; left: 0; width: 1px; height: 24px; }
    .corner.br { bottom: 28px; right: 28px; }
    .corner.br::before { bottom: 0; right: 0; width: 24px; height: 1px; }
    .corner.br::after  { bottom: 0; right: 0; width: 1px; height: 24px; }

    .left {
      position: relative; z-index: 2;
      padding: 70px 56px 60px 70px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .brand {
      display: flex; align-items: center; gap: 0.7rem;
    }
    .brand-dot {
      width: 28px; height: 28px; border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #F4FFB0, var(--lime) 38%, #A8D628 100%);
      box-shadow: 0 0 22px -2px rgba(204, 255, 51, 0.55);
    }
    .brand-mark {
      font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400;
      font-size: 36px; letter-spacing: -0.035em; line-height: 1;
      color: var(--cream);
    }
    .brand-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--cream-dim);
      margin-left: 0.3rem;
      padding-top: 6px;
    }
    .kicker {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--cream-dim);
      display: flex; align-items: center; gap: 0.65rem;
      margin-top: 28px;
    }
    .kicker .rule {
      display: block; width: 32px; height: 1px; background: var(--cream-dim);
    }
    h1 {
      font-family: 'Instrument Serif', serif; font-weight: 400;
      font-size: 76px; line-height: 1.0; letter-spacing: -0.035em;
      color: var(--cream);
      margin-top: 26px;
      max-width: 11ch;
    }
    h1 .it { font-style: italic; }
    h1 .ul {
      background-image: linear-gradient(transparent 76%, rgba(204, 255, 51, 0.55) 76%, rgba(204, 255, 51, 0.55) 92%, transparent 92%);
      background-size: 100% 100%;
      background-repeat: no-repeat;
      padding: 0 0.04em;
    }
    .sub {
      font-family: 'Manrope', sans-serif;
      font-size: 17px; line-height: 1.5;
      color: var(--cream-dim);
      max-width: 38ch;
      margin-top: 22px;
    }
    .sub .strong { color: var(--cream); }
    .footrow {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1.5rem;
    }
    .url {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--cream);
      display: inline-flex; align-items: center; gap: 0.6rem;
    }
    .url .arrow { color: var(--lime); }
    .meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--muted);
    }

    /* Right: Chaos map */
    .right {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      padding: 30px;
    }
    .map-frame {
      position: relative;
      width: 540px; height: 540px;
      border-radius: 22px;
      overflow: hidden;
      background: radial-gradient(ellipse 90% 90% at 50% 45%, #15130F 0%, #0D0B09 60%, transparent 100%);
      border: 1px solid var(--border);
    }
    .map-frame .corner.tl { top: 14px; left: 14px; }
    .map-frame .corner.tl::before { width: 16px; }
    .map-frame .corner.tl::after  { height: 16px; }
    .map-frame .corner.tr { top: 14px; right: 14px; }
    .map-frame .corner.tr::before { width: 16px; }
    .map-frame .corner.tr::after  { height: 16px; }
    .map-frame .corner.bl { bottom: 14px; left: 14px; }
    .map-frame .corner.bl::before { width: 16px; }
    .map-frame .corner.bl::after  { height: 16px; }
    .map-frame .corner.br { bottom: 14px; right: 14px; }
    .map-frame .corner.br::before { width: 16px; }
    .map-frame .corner.br::after  { height: 16px; }

    .map-label {
      position: absolute; top: 18px; left: 22px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--cream-dim);
      display: inline-flex; align-items: center; gap: 0.55rem;
      z-index: 4;
    }
    .map-label .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 8px var(--lime); }

    .pill {
      position: absolute; top: 16px; right: 18px;
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 6px 11px;
      background: rgba(11, 10, 8, 0.65);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-bright);
      border-radius: 999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--cream);
      z-index: 4;
    }
    .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--lime); }

    svg { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="card">
    <span class="grid-bg"></span>
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>

    <!-- LEFT — type + brand -->
    <div class="left">
      <div>
        <div class="brand">
          <span class="brand-dot"></span>
          <span class="brand-mark">aql</span>
          <span class="brand-tag">/ studio</span>
        </div>
        <div class="kicker">
          <span class="rule"></span>
          <span>Operational Infrastructure</span>
        </div>
        <h1>
          Your stack,<br/>
          <span class="it">finally <span class="ul">running</span></span><br/>
          <span class="it">as one.</span>
        </h1>
        <p class="sub">
          The dashboards, CRMs, integrations and automations that make scattered tools
          <span class="strong">run as one.</span> Across e-commerce, finance and services.
        </p>
      </div>
      <div class="footrow">
        <div class="url">
          aql-showcase.vercel.app
          <span class="arrow">→</span>
        </div>
        <div class="meta">EST · 2021 · NL / EU</div>
      </div>
    </div>

    <!-- RIGHT — chaos map (clean orbit) -->
    <div class="right">
      <div class="map-frame">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <span class="map-label"><span class="dot"></span>Fig.01 — The Chaos Map</span>
        <span class="pill"><span class="dot"></span>STATUS · SYNCED</span>

        <svg viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet" id="og-map">
          <defs>
            <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#CCFF33" stop-opacity="0.42" />
              <stop offset="40%" stop-color="#CCFF33" stop-opacity="0.10" />
              <stop offset="100%" stop-color="#CCFF33" stop-opacity="0" />
            </radialGradient>
            <filter id="hubBlur" x="-100%" y="-100%" width="300%" height="300%">
              <feGaussianBlur stdDeviation="6" />
            </filter>
          </defs>

          <!-- center glow -->
          <circle cx="300" cy="300" r="240" fill="url(#centerGlow)" />

          <!-- crosshair -->
          <g opacity="0.30" stroke="#3A3527" stroke-width="0.6">
            <line x1="0" y1="300" x2="600" y2="300" stroke-dasharray="1 7" />
            <line x1="300" y1="0" x2="300" y2="600" stroke-dasharray="1 7" />
          </g>

          <!-- guide rings -->
          <g opacity="0.32" stroke="#3A3527" stroke-width="0.5" fill="none">
            <circle cx="300" cy="300" r="120" stroke-dasharray="2 5" />
            <circle cx="300" cy="300" r="220" stroke-dasharray="2 5" />
            <circle cx="300" cy="300" r="280" stroke-dasharray="2 8" opacity="0.5" />
          </g>

          <!-- order lines from each node to hub -->
          <g id="lines" stroke="#CCFF33" stroke-width="0.9" opacity="0.55" fill="none"></g>

          <!-- nodes -->
          <g id="og-nodes"></g>

          <!-- AQL center hub -->
          <g transform="translate(300,300)">
            <circle r="44" fill="#0B0A08" stroke="#CCFF33" stroke-width="1.2" opacity="0.35" />
            <circle r="36" fill="#0B0A08" stroke="#CCFF33" stroke-width="1.5" />
            <circle r="30" fill="#CCFF33" />
            <circle r="30" fill="#CCFF33" filter="url(#hubBlur)" opacity="0.55" />
            <text y="3" text-anchor="middle" font-family="Instrument Serif" font-style="italic" font-size="22" fill="#0B0A08" font-weight="500">aql</text>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <script>
  (() => {
    const NS = 'http://www.w3.org/2000/svg';
    const platforms = [
      { id: 'shopify',  logo: 'shopify' },
      { id: 'bol',      mark: 'bol', dot: true },
      { id: 'amazon',   logoSrc: '/brand_assets/logos/amazon.png', wide: true },
      { id: 'temu',     mark: 'temu' },
      { id: 'noon',     mark: 'noon', dot: true },
      { id: 'tiktok',   logo: 'tiktok' },
      { id: 'klaviyo',  mark: 'klvyo' },
      { id: 'meta',     logo: 'meta' },
      { id: 'stripe',   logo: 'stripe' },
      { id: 'mollie',   mark: 'mollie' },
      { id: 'dhl',      logo: 'dhl' },
      { id: 'hubspot',  logo: 'hubspot' },
      { id: 'gmail',    logo: 'gmail' },
      { id: 'sheets',   logo: 'googlesheets' },
      { id: 'drive',    logo: 'googledrive' },
      { id: 'calendly', logo: 'calendly' },
      { id: 'whatsapp', logo: 'whatsapp' },
      { id: 'telegram', logo: 'telegram' },
    ];
    const cx = 300, cy = 300, orbitR = 220;
    const nodesG = document.getElementById('og-nodes');
    const linesG = document.getElementById('lines');

    platforms.forEach((p, i) => {
      const angle = (i / platforms.length) * Math.PI * 2 - Math.PI / 2;
      const x = cx + Math.cos(angle) * orbitR;
      const y = cy + Math.sin(angle) * orbitR;

      // line to center
      const path = document.createElementNS(NS, 'path');
      const mx = (x + cx) / 2, my = (y + cy) / 2;
      const dx = cx - x, dy = cy - y;
      const len = Math.hypot(dx, dy) || 1;
      const px = -dy / len, py = dx / len;
      const nudge = 22 * Math.sin(angle * 2);
      path.setAttribute('d', `M${x},${y} Q${mx + px*nudge},${my + py*nudge} ${cx},${cy}`);
      linesG.appendChild(path);

      // node
      const g = document.createElementNS(NS, 'g');
      g.setAttribute('transform', `translate(${x}, ${y})`);

      const ring = document.createElementNS(NS, 'circle');
      ring.setAttribute('r', 25);
      ring.setAttribute('fill', '#0B0A08');
      ring.setAttribute('stroke', '#CCFF33');
      ring.setAttribute('stroke-width', '1.4');
      g.appendChild(ring);

      const ringInner = document.createElementNS(NS, 'circle');
      ringInner.setAttribute('r', 19);
      ringInner.setAttribute('fill', 'none');
      ringInner.setAttribute('stroke', '#5A6E1F');
      ringInner.setAttribute('stroke-width', '0.5');
      ringInner.setAttribute('stroke-dasharray', '1 3');
      g.appendChild(ringInner);

      if (p.logo || p.logoSrc) {
        const img = document.createElementNS(NS, 'image');
        img.setAttribute('href', p.logoSrc || `https://cdn.simpleicons.org/${p.logo}/EDE6D3`);
        if (p.wide) {
          img.setAttribute('x', '-16');
          img.setAttribute('y', '-6');
          img.setAttribute('width', '32');
          img.setAttribute('height', '12');
          img.setAttribute('style', 'mix-blend-mode: screen');
        } else {
          img.setAttribute('x', '-11');
          img.setAttribute('y', '-11');
          img.setAttribute('width', '22');
          img.setAttribute('height', '22');
        }
        img.setAttribute('preserveAspectRatio', 'xMidYMid meet');
        g.appendChild(img);
      } else {
        const text = document.createElementNS(NS, 'text');
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('y', '4');
        const len = p.mark.length;
        const fontSize = len <= 4 ? 12 : len === 5 ? 10.5 : len === 6 ? 9.5 : 8.5;
        text.setAttribute('font-family', 'Manrope');
        text.setAttribute('font-size', fontSize);
        text.setAttribute('font-weight', '700');
        text.setAttribute('letter-spacing', '-0.3');
        text.setAttribute('fill', '#EDE6D3');
        text.textContent = p.mark;
        g.appendChild(text);
        if (p.dot) {
          const w = len * fontSize * 0.55;
          const accent = document.createElementNS(NS, 'circle');
          accent.setAttribute('r', '1.6');
          accent.setAttribute('cx', String(w / 2 + 1.8));
          accent.setAttribute('cy', '4');
          accent.setAttribute('fill', '#CCFF33');
          g.appendChild(accent);
        }
      }
      nodesG.appendChild(g);
    });
  })();
  </script>
</body>
</html>
